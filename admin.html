<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المخزون - سوبر ماركت ابن الحاج إسماعيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 rounded-2xl flex justify-between items-center shadow-lg">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-green-500"></i> لوحة تحكم صاحب الماركت
                </h1>
                <p class="text-xs text-slate-400 mt-1">تعديل المخزون، الأسعار، وإعدادات الواتساب وInstaPay مباشرة</p>
            </div>
            <a href="index.html" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2">
                <i class="fa-solid fa-store"></i> معاينة المتجر
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Product Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <h2 class="text-lg font-bold text-slate-800" id="form-title">إضافة / تعديل منتج</h2>
                <form id="product-form" onsubmit="saveProduct(event)" class="space-y-3">
                    <input type="hidden" id="edit-prod-id">
                    <div>
                        <label class="block text-xs font-bold mb-1">اسم المنتج</label>
                        <input type="text" id="prod-name" required class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold mb-1">السعر (ج.م)</label>
                            <input type="number" step="0.5" id="prod-price" required class="w-full p-2 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">المخزون</label>
                            <input type="number" id="prod-stock" required class="w-full p-2 border rounded-xl text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">القسم</label>
                        <input type="text" id="prod-category" required placeholder="ألبان، زيوت..." class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">رابط الصورة (URL)</label>
                        <input type="url" id="prod-image" placeholder="https://..." class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-bold shadow hover:bg-green-700 text-sm">حفظ المنتج</button>
                        <button type="button" onclick="resetForm()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold text-sm">إلغاء</button>
                    </div>
                </form>

                <hr class="my-4">

                <!-- Store Settings Form -->
                <div class="space-y-3">
                    <h3 class="font-bold text-sm text-slate-800">إعدادات الدفع والواتساب</h3>
                    <div>
                        <label class="block text-xs font-semibold mb-1">رقم الواتساب (بدون +)</label>
                        <input type="text" id="store-whatsapp" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">حساب InstaPay</label>
                        <input type="text" id="store-instapay" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <button onclick="saveStoreSettings()" class="w-full bg-slate-800 text-white py-2 rounded-xl font-bold text-sm shadow hover:bg-slate-900">حفظ الإعدادات</button>
                </div>
            </div>

            <!-- Inventory Table -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border">
                <h2 class="text-lg font-bold mb-4 text-slate-800">جدول المنتجات بالمخزن الحالي</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b text-slate-600 text-xs">
                                <th class="p-3">المنتج</th>
                                <th class="p-3">القسم</th>
                                <th class="p-3">السعر</th>
                                <th class="p-3">المخزون</th>
                                <th class="p-3 text-center">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="admin-inventory-table">
                            <tr><td colspan="5" class="p-4 text-center text-slate-400">جاري تحميل المخزون...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let products = [
            { id: "1", name: "أرز مصري فاخر 1 كجم", price: 35, stock: 20, category: "بقالة", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500" },
            { id: "2", name: "زيت عباد الشمس 1 لتر", price: 65, stock: 15, category: "زيوت", image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500" },
            { id: "3", name: "حليب كامل الدسم 1 لتر", price: 40, stock: 10, category: "ألبان", image: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=500" }
        ];

        window.onload = function() {
            loadAdminData();
        };

        function loadAdminData() {
            const savedProducts = localStorage.getItem('market_products');
            const savedSettings = localStorage.getItem('market_settings');

            if (savedProducts) products = JSON.parse(savedProducts);
            else localStorage.setItem('market_products', JSON.stringify(products));

            if (savedSettings) {
                const settings = JSON.parse(savedSettings);
                document.getElementById('store-whatsapp').value = settings.whatsapp;
                document.getElementById('store-instapay').value = settings.instapay;
            } else {
                document.getElementById('store-whatsapp').value = "201000000000";
                document.getElementById('store-instapay').value = "elhaj-esmail@instapay";
            }

            renderAdminProducts();
        }

        function renderAdminProducts() {
            const table = document.getElementById('admin-inventory-table');
            if(products.length === 0) {
                table.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">لا توجد منتجات بالمخزن حالياً. أضف منتجك الأول من النموذج الجانبي.</td></tr>`;
                return;
            }

            table.innerHTML = products.map(p => `
                <tr class="border-b hover:bg-slate-50 text-sm">
                    <td class="p-3 font-semibold">${p.name}</td>
                    <td class="p-3 text-slate-500">${p.category}</td>
                    <td class="p-3 font-bold">${p.price} ج.م</td>
                    <td class="p-3"><span class="px-2 py-1 rounded-md text-xs font-bold ${p.stock < 10 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700'}">${p.stock}</span></td>
                    <td class="p-3 text-center space-x-2 space-x-reverse">
                        <button onclick="editProduct('${p.id}')" class="text-blue-600 font-bold px-1"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteProduct('${p.id}')" class="text-red-600 font-bold px-1"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('edit-prod-id').value || Date.now().toString();
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value);
            const category = document.getElementById('prod-category').value;
            const image = document.getElementById('prod-image').value || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=500';

            const existingIndex = products.findIndex(p => p.id === id);
            if (existingIndex > -1) {
                products[existingIndex] = { id, name, price, stock, category, image };
            } else {
                products.push({ id, name, price, stock, category, image });
            }

            localStorage.setItem('market_products', JSON.stringify(products));
            resetForm();
            renderAdminProducts();
            alert('تم حفظ المنتج وتحديث المتجر فوراً!');
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            document.getElementById('edit-prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-stock').value = p.stock;
            document.getElementById('prod-category').value = p.category;
            document.getElementById('prod-image').value = p.image;
            document.getElementById('form-title').innerText = "تعديل بيانات المنتج";
        }

        function deleteProduct(id) {
            if (confirm('هل أنت تأكد من حذف هذا المنتج من المخزون؟')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('market_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('edit-prod-id').value = '';
            document.getElementById('form-title').innerText = "إضافة / تعديل منتج";
        }

        function saveStoreSettings() {
            const whatsapp = document.getElementById('store-whatsapp').value;
            const instapay = document.getElementById('store-instapay').value;
            localStorage.setItem('market_settings', JSON.stringify({ whatsapp, instapay }));
            alert('تم حفظ إعدادات الواتساب وInstaPay بنجاح!');
        }
    </script>
</body>
</html>
